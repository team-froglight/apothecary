name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        # team-froglight libraries resolve from GitHub Packages with the workflow token;
        # set PACKAGES_READ_TOKEN if a private package is ever needed.
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || github.token }}
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: apothecary
          path: neoforge/build/libs/
          if-no-files-found: error
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

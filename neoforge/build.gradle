plugins {
    id 'idea'
    id 'net.neoforged.moddev' version "${mdg_plugin_version}"
}

base.archivesName = "${mod_id}-neoforge-${minecraft_version}"

evaluationDependsOn(':core')
def core = project(':core')

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            gameDirectory = rootProject.file('run')
        }
        client {
            client()
            programArguments.addAll('--width', '1280', '--height', '720')
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll('--quickPlaySingleplayer', project.property('quickPlayWorld').toString())
            }
        }
    }

    mods {
        "${mod_id}" {
            // core + backend form one mod module at runtime
            sourceSet(sourceSets.main)
            sourceSet(core.sourceSets.main)
        }
    }
}

dependencies {
    implementation core
}

// Ship core's classes inside the mod jar so the mod is a single drop-in file.
tasks.named('jar', Jar) {
    from(core.sourceSets.main.output)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
        neo_version: neo_version, neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
        mod_version: project.version.toString(), mod_authors: mod_authors,
        mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

// JEC (development only): in-game inspection, rendering and hot-swap for runClient. Never bundled.
repositories {
    maven { name = 'JEC'; url = 'https://gitlab.com/api/v4/projects/87129086/packages/maven' }
}
dependencies {
    runtimeOnly 'com.jec:jec-neoforge-1.21.1:0.2.0'
}
neoForge.runs.configureEach {
    jvmArgument '-Djdk.attach.allowAttachSelf=true'
    jvmArgument '-XX:+EnableDynamicAgentLoading'
}

// Published for mods that build on Apothecary: one jar (core + backend), no further dependencies.
// Depend on me.methodial.apothecary:apothecary-neoforge and jarJar it. `./gradlew publishToMavenLocal`
// for a local checkout; the Publish workflow runs `./gradlew publish` to GitHub Packages.
apply plugin: 'maven-publish'
publishing {
    publications {
        mod(MavenPublication) {
            artifactId = 'apothecary-neoforge'
            artifact tasks.named('jar')
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/team-froglight/apothecary'
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrElse('')
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrElse('')
            }
        }
    }
}
